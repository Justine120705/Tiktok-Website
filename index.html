<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D RPG - Village Encounter</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --accent-color: #ff0050;
            --dialog-bg: rgba(15, 16, 21, 0.92);
            --border-color: rgba(255, 255, 255, 0.15);
            --text-color: #f0f0f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-wrapper {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        canvas {
            display: block;
            background-color: #2d5a27;
        }

        /* Dialogue Overlay Box */
        .dialogue-box {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: var(--dialog-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            padding: 16px;
            display: none;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .dialogue-box.active {
            display: flex;
        }

        .speaker-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dialogue-text {
            font-size: 1rem;
            line-height: 1.4;
            color: var(--text-color);
        }

        .dialogue-prompt {
            align-self: flex-end;
            font-size: 0.75rem;
            color: #888;
            margin-top: 4px;
        }

        .controls-hint {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #7a7e8d;
        }

        kbd {
            background: #222531;
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="640" height="480"></canvas>
        
        <!-- Dialogue UI -->
        <div id="dialogueBox" class="dialogue-box">
            <div id="speakerName" class="speaker-name">NPC</div>
            <div id="dialogueText" class="dialogue-text">...</div>
            <div class="dialogue-prompt">Press <kbd>E</kbd> or <kbd>Space</kbd> to continue</div>
        </div>
    </div>

    <div class="controls-hint">
        Use <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or Arrow Keys to move • Press <kbd>E</kbd> or <kbd>Space</kbd> near NPC to talk
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const dialogueBox = document.getElementById('dialogueBox');
        const speakerName = document.getElementById('speakerName');
        const dialogueText = document.getElementById('dialogueText');

        // Input state
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;

            // Handle interaction key
            if (e.key.toLowerCase() === 'e' || e.key === ' ') {
                handleInteraction();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Player configuration
        const player = {
            x: 100,
            y: 200,
            width: 28,
            height: 28,
            color: '#3b82f6',
            speed: 3
        };

        // NPC configurations
        const npcs = [
            {
                id: 'elder',
                name: 'Elder Marcus',
                x: 400,
                y: 180,
                width: 28,
                height: 28,
                color: '#eab308',
                dialogues: [
                    "Greetings, traveler! Welcome to our quiet village.",
                    "Beware if you venture east; dark shadows lurk in the woods.",
                    "Stay safe on your journey!"
                ],
                dialogueIndex: 0,
                isTalking: false
            },
            {
                id: 'merchant',
                name: 'Merchant Lynne',
                x: 220,
                y: 340,
                width: 28,
                height: 28,
                color: '#10b981',
                dialogues: [
                    "Looking to trade? I'm currently waiting for my shipment.",
                    "Check back later once the roads clear up."
                ],
                dialogueIndex: 0,
                isTalking: false
            }
        ];

        let activeNPC = null;

        // Interaction Handler
        function handleInteraction() {
            if (activeNPC) {
                // Progress dialogue
                activeNPC.dialogueIndex++;

                if (activeNPC.dialogueIndex >= activeNPC.dialogues.length) {
                    // End dialogue
                    closeDialogue();
                } else {
                    // Show next line
                    updateDialogueText();
                }
            } else {
                // Check if player is near any NPC
                for (let npc of npcs) {
                    if (getDistance(player, npc) < 50) {
                        startDialogue(npc);
                        break;
                    }
                }
            }
        }

        function startDialogue(npc) {
            activeNPC = npc;
            activeNPC.dialogueIndex = 0;
            speakerName.textContent = npc.name;
            updateDialogueText();
            dialogueBox.classList.add('active');
        }

        function updateDialogueText() {
            if (activeNPC) {
                dialogueText.textContent = activeNPC.dialogues[activeNPC.dialogueIndex];
            }
        }

        function closeDialogue() {
            dialogueBox.classList.remove('active');
            if (activeNPC) {
                activeNPC.dialogueIndex = 0;
                activeNPC = null;
            }
        }

        // Distance calculation utility
        function getDistance(obj1, obj2) {
            const dx = (obj1.x + obj1.width / 2) - (obj2.x + obj2.width / 2);
            const dy = (obj1.y + obj1.height / 2) - (obj2.y + obj2.height / 2);
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Collision check
        function checkCollision(newX, newY, obj) {
            return (
                newX < obj.x + obj.width &&
                newX + player.width > obj.x &&
                newY < obj.y + obj.height &&
                newY + player.height > obj.y
            );
        }

        // Movement logic
        function updatePlayer() {
            if (activeNPC) return; // Lock movement during conversation

            let moveX = 0;
            let moveY = 0;

            if (keys['w'] || keys['arrowup']) moveY -= player.speed;
            if (keys['s'] || keys['arrowdown']) moveY += player.speed;
            if (keys['a'] || keys['arrowleft']) moveX -= player.speed;
            if (keys['d'] || keys['arrowright']) moveX += player.speed;

            // Normalize diagonal speed
            if (moveX !== 0 && moveY !== 0) {
                moveX *= 0.7071;
                moveY *= 0.7071;
            }

            let nextX = player.x + moveX;
            let nextY = player.y + moveY;

            // Boundary collisions
            nextX = Math.max(0, Math.min(canvas.width - player.width, nextX));
            nextY = Math.max(0, Math.min(canvas.height - player.height, nextY));

            // NPC collisions
            let collideX = false;
            let collideY = false;

            for (let npc of npcs) {
                if (checkCollision(nextX, player.y, npc)) collideX = true;
                if (checkCollision(player.x, nextY, npc)) collideY = true;
            }

            if (!collideX) player.x = nextX;
            if (!collideY) player.y = nextY;
        }

        // Render loop
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw ground details
            ctx.fillStyle = '#24491f';
            ctx.fillRect(80, 80, 120, 90);
            ctx.fillRect(450, 300, 140, 100);

            // Draw NPCs
            npcs.forEach(npc => {
                ctx.fillStyle = npc.color;
                ctx.fillRect(npc.x, npc.y, npc.width, npc.height);

                // Draw interaction prompt indicator when near
                const dist = getDistance(player, npc);
                if (dist < 50 && !activeNPC) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('[E] Talk', npc.x + npc.width / 2, npc.y - 8);
                }
            });

            // Draw Player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        function gameLoop() {
            updatePlayer();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
