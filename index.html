<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyxor | Film & Movie Edits</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-pink: #ff0050;
            --accent-cyan: #00f2fe;
            --text-main: #ffffff;
            --text-muted: #a0a5b5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Ambient glow background effect */
        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 0, 80, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px;
        }

        /* Profile Card */
        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            margin-bottom: 40px;
        }

        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .handle-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            letter-spacing: 0.5px;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 6px;
        }

        .bio {
            color: var(--accent-pink);
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 24px;
        }

        .goal-badge {
            display: inline-block;
            background: rgba(255, 0, 80, 0.1);
            color: var(--accent-pink);
            border: 1px solid rgba(255, 0, 80, 0.2);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 480px;
            margin: 0 auto 30px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 14px 8px;
            border-radius: 16px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 800;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Call to Action Button */
        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(45deg, var(--accent-pink), #ff5e00);
            color: #fff;
            padding: 16px 36px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(255, 0, 80, 0.35);
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 0, 80, 0.55);
        }

        /* Gallery Title */
        .section-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.4rem;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        /* Edit Showcase Cards */
        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .video-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 9/16;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            align-items: flex-end;
            padding: 16px;
            text-decoration: none;
            color: white;
        }

        .video-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.85) 100%);
            z-index: 1;
        }

        .card-info {
            position: relative;
            z-index: 2;
        }

        .card-tag {
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 3px 8px;
            border-radius: 6px;
            backdrop-filter: blur(6px);
            text-transform: uppercase;
            font-weight: 600;
        }

        .card-title {
            font-weight: 700;
            font-size: 1.05rem;
            margin-top: 6px;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 24px 0;
            border-top: 1px solid var(--border-color);
            width: 100%;
        }
    </style>
</head>
<body>

</html>
